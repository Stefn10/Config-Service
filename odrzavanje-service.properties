# Naziv aplikacije i port na kome radi
spring.application.name=odrzavanje-service
server.port=8081
logging.pattern.level=%5p [${spring.application.name:},%X{traceId:-},%X{spanId:-}]

# Sada MySQL
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/odrzavanje_db?createDatabaseIfNotExist=true}
spring.datasource.driverClassName=com.mysql.cj.jdbc.Driver
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}


# JPA / Hibernate podesavanja
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=none

# SQL init (schema.sql + data.sql, idempotent, runs at every startup)
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql
spring.sql.init.data-locations=classpath:data.sql
spring.sql.init.continue-on-error=false
spring.jpa.defer-datasource-initialization=true


# Ispis SQL upita u konzoli (korisno za debagovanje)
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Feign poziv ka smestaj servisu
clients.smestaj.url=http://localhost:8082

# Swagger dokumentacija (interfejs za testiranje endpointa)
# Putanja: http://localhost:8081/swagger-ui.html
springdoc.swagger-ui.path=/swagger-ui.html

# Resilience4j retry
# max-attempts includes the first call
resilience4j.retry.instances.smestajServiceReadRetry.max-attempts=4
resilience4j.retry.instances.smestajServiceReadRetry.wait-duration=300ms
# Ne retry-uj klijentske greske (los zahtev / nepostojeci resurs)
resilience4j.retry.instances.smestajServiceReadRetry.ignore-exceptions=org.example.odrzavanjeservice.exception.RemoteClientException,feign.FeignException$BadRequest,feign.FeignException$NotFound

# Resilience4j circuit breaker
resilience4j.circuitbreaker.instances.smestajServiceBreaker.sliding-window-type=COUNT_BASED
resilience4j.circuitbreaker.instances.smestajServiceBreaker.sliding-window-size=6
# Ne racuna failure rate dok nema bar 4 poziva
resilience4j.circuitbreaker.instances.smestajServiceBreaker.minimum-number-of-calls=4
# Ako je >= 50% neuspeha, breaker prelazi u OPEN
resilience4j.circuitbreaker.instances.smestajServiceBreaker.failure-rate-threshold=50
# U OPEN ostaje 10 sekundi pre probe oporavka
resilience4j.circuitbreaker.instances.smestajServiceBreaker.wait-duration-in-open-state=10s
# U HALF_OPEN pusta 2 probna poziva
resilience4j.circuitbreaker.instances.smestajServiceBreaker.permitted-number-of-calls-in-half-open-state=2
# Automatski prelazi iz OPEN u HALF_OPEN posle cekanja
resilience4j.circuitbreaker.instances.smestajServiceBreaker.automatic-transition-from-open-to-half-open-enabled=true
resilience4j.circuitbreaker.instances.smestajServiceBreaker.record-exceptions=feign.FeignException,feign.RetryableException,java.net.ConnectException,java.net.SocketTimeoutException,java.io.IOException
# Klijentske greske ne tretiramo kao kvar udaljenog servisa za CB metrike
resilience4j.circuitbreaker.instances.smestajServiceBreaker.ignore-exceptions=org.example.odrzavanjeservice.exception.RemoteClientException,feign.FeignException$BadRequest,feign.FeignException$NotFound
resilience4j.circuitbreaker.instances.smestajServiceBreaker.register-health-indicator=true

# Actuator monitoring
management.endpoints.web.exposure.include=health,info,metrics,circuitbreakers,circuitbreakerevents,retries,retryevents,refresh
management.endpoint.health.show-details=always
management.endpoint.health.show-components=always
management.health.circuitbreakers.enabled=true
management.tracing.sampling.probability=1.0
management.zipkin.tracing.endpoint=http://localhost:9411/api/v2/spans

# Resilience4j debug logovi za laksi prikaz stanja osiguraca tokom demonstracije
logging.level.io.github.resilience4j.circuitbreaker=DEBUG
logging.level.io.github.resilience4j.retry=DEBUG

config.version=1
