spring.application.name=api-gateway
server.port=8080

clients.auth.url=${CLIENTS_AUTH_URL:http://localhost:8083}

# Ruta ka odrzavanje-service API-ju
spring.cloud.gateway.server.webflux.routes[0].id=odrzavanje-service
spring.cloud.gateway.server.webflux.routes[0].uri=${ODRZAVANJE_SERVICE_URL:http://localhost:8081}
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/api/work-order/**,/api/worker/**,/api/maintenance-task/**,/api/maintenance-log/**

# Ruta ka smestaj-service API-ju
spring.cloud.gateway.server.webflux.routes[1].id=smestaj-service
spring.cloud.gateway.server.webflux.routes[1].uri=${SMESTAJ_SERVICE_URL:http://localhost:8082}
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/api/unit/**,/api/address/**,/api/facility/**,/api/price-tier/**,/api/availability-calendar/**

# Ruta ka auth-service API-ju
spring.cloud.gateway.server.webflux.routes[2].id=auth-service
spring.cloud.gateway.server.webflux.routes[2].uri=${clients.auth.url}
spring.cloud.gateway.server.webflux.routes[2].predicates[0]=Path=/api/auth/**

# Ruta ka rezervacija-service API-ju
spring.cloud.gateway.server.webflux.routes[3].id=rezervacija-service
spring.cloud.gateway.server.webflux.routes[3].uri=${REZERVACIJA_SERVICE_URL:http://localhost:8084}
spring.cloud.gateway.server.webflux.routes[3].predicates[0]=Path=/api/booking/**,/api/booking-status-log/**,/api/addon-item/**,/api/cancellation-policy/**,/api/guest/**

# Ruta ka finansije-service API-ju
spring.cloud.gateway.server.webflux.routes[4].id=finansije-service
spring.cloud.gateway.server.webflux.routes[4].uri=${FINANSIJE_SERVICE_URL:http://localhost:8085}
spring.cloud.gateway.server.webflux.routes[4].predicates[0]=Path=/api/invoice/**,/api/payment-method/**,/api/transaction/**,/api/tax-rate/**

# Swagger agregacija: docs odrzavanje-service
spring.cloud.gateway.server.webflux.routes[5].id=odrzavanje-docs
spring.cloud.gateway.server.webflux.routes[5].uri=${ODRZAVANJE_SERVICE_URL:http://localhost:8081}
spring.cloud.gateway.server.webflux.routes[5].predicates[0]=Path=/v3/api-docs/odrzavanje
spring.cloud.gateway.server.webflux.routes[5].filters[0]=SetPath=/v3/api-docs

# Swagger agregacija: docs smestaj-service
spring.cloud.gateway.server.webflux.routes[6].id=smestaj-docs
spring.cloud.gateway.server.webflux.routes[6].uri=${SMESTAJ_SERVICE_URL:http://localhost:8082}
spring.cloud.gateway.server.webflux.routes[6].predicates[0]=Path=/v3/api-docs/smestaj
spring.cloud.gateway.server.webflux.routes[6].filters[0]=SetPath=/v3/api-docs

# Swagger agregacija: docs auth-service
spring.cloud.gateway.server.webflux.routes[7].id=auth-docs
spring.cloud.gateway.server.webflux.routes[7].uri=${clients.auth.url}
spring.cloud.gateway.server.webflux.routes[7].predicates[0]=Path=/v3/api-docs/auth
spring.cloud.gateway.server.webflux.routes[7].filters[0]=SetPath=/v3/api-docs

# Swagger agregacija: docs rezervacija-service (springdoc.api-docs.path=/api-docs u rezervaciji)
spring.cloud.gateway.server.webflux.routes[8].id=rezervacija-docs
spring.cloud.gateway.server.webflux.routes[8].uri=${REZERVACIJA_SERVICE_URL:http://localhost:8084}
spring.cloud.gateway.server.webflux.routes[8].predicates[0]=Path=/v3/api-docs/rezervacija
spring.cloud.gateway.server.webflux.routes[8].filters[0]=SetPath=/api-docs

# Swagger agregacija: docs finansije-service (springdoc.api-docs.path=/api-docs u finansijama)
spring.cloud.gateway.server.webflux.routes[9].id=finansije-docs
spring.cloud.gateway.server.webflux.routes[9].uri=${FINANSIJE_SERVICE_URL:http://localhost:8085}
spring.cloud.gateway.server.webflux.routes[9].predicates[0]=Path=/v3/api-docs/finansije
spring.cloud.gateway.server.webflux.routes[9].filters[0]=SetPath=/api-docs

# Swagger UI na gateway-u
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.urls[0].name=odrzavanje-service
springdoc.swagger-ui.urls[0].url=/v3/api-docs/odrzavanje
springdoc.swagger-ui.urls[1].name=smestaj-service
springdoc.swagger-ui.urls[1].url=/v3/api-docs/smestaj
springdoc.swagger-ui.urls[2].name=auth-service
springdoc.swagger-ui.urls[2].url=/v3/api-docs/auth
springdoc.swagger-ui.urls[3].name=rezervacija-service
springdoc.swagger-ui.urls[3].url=/v3/api-docs/rezervacija
springdoc.swagger-ui.urls[4].name=finansije-service
springdoc.swagger-ui.urls[4].url=/v3/api-docs/finansije

gateway.auth.enabled=true
gateway.auth.validation-uri=${clients.auth.url}/api/auth/validate
gateway.auth.excluded-paths[0]=/swagger-ui/**
gateway.auth.excluded-paths[1]=/v3/api-docs/**
gateway.auth.excluded-paths[2]=/actuator/**
gateway.auth.excluded-paths[3]=/api/auth/**

gateway.rbac.admin-only-paths[0]=/api/worker/**
gateway.rbac.admin-only-paths[1]=/api/maintenance-task/**
gateway.rbac.admin-only-paths[2]=/api/maintenance-log/**
gateway.rbac.admin-only-paths[3]=/api/tax-rate/**
gateway.rbac.admin-only-paths[4]=/api/payment-method/**
gateway.rbac.guide-or-admin-paths[0]=/api/work-order/**
gateway.rbac.guide-or-admin-paths[1]=/api/invoice/**
gateway.rbac.guide-or-admin-paths[2]=/api/transaction/**
gateway.rbac.guide-or-admin-paths[3]=/api/booking-status-log/**
gateway.rbac.guest-readable-paths[0]=/api/unit/**
gateway.rbac.guest-readable-paths[1]=/api/address/**
gateway.rbac.guest-readable-paths[2]=/api/facility/**
gateway.rbac.guest-readable-paths[3]=/api/price-tier/**
gateway.rbac.guest-readable-paths[4]=/api/availability-calendar/**
gateway.rbac.guest-readable-paths[5]=/api/booking/**
gateway.rbac.guest-readable-paths[6]=/api/guest/**
gateway.rbac.guest-readable-paths[7]=/api/addon-item/**
gateway.rbac.guest-readable-paths[8]=/api/cancellation-policy/**

gateway.rate-limit.enabled=true
gateway.rate-limit.window-seconds=60
gateway.rate-limit.critical-limit=30
gateway.rate-limit.critical-methods[0]=POST
gateway.rate-limit.critical-methods[1]=PUT
gateway.rate-limit.critical-methods[2]=PATCH
gateway.rate-limit.critical-methods[3]=DELETE
gateway.rate-limit.critical-paths[0]=/api/work-order/**
gateway.rate-limit.critical-paths[1]=/api/unit/**
gateway.rate-limit.critical-paths[2]=/api/availability-calendar/**
gateway.rate-limit.critical-paths[3]=/api/booking/**
gateway.rate-limit.critical-paths[4]=/api/invoice/**
gateway.rate-limit.critical-paths[5]=/api/transaction/**

management.endpoints.web.exposure.include=health,info,gateway,refresh
management.tracing.sampling.probability=1.0
management.zipkin.tracing.endpoint=http://localhost:9411/api/v2/spans
logging.pattern.level=%5p [${spring.application.name:},%X{traceId:-},%X{spanId:-}]

config.version=1
