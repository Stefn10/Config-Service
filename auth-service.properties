spring.application.name=auth-service
server.port=8083
logging.pattern.level=%5p [${spring.application.name:},%X{traceId:-},%X{spanId:-}]

# Sada MySQL
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/auth_db?createDatabaseIfNotExist=true}
spring.datasource.driverClassName=com.mysql.cj.jdbc.Driver
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}


# JPA / Hibernate podesavanja
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=none

# SQL init (schema.sql + data.sql, idempotent, runs at every startup)
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql
spring.sql.init.data-locations=classpath:data.sql
spring.sql.init.continue-on-error=false
spring.jpa.defer-datasource-initialization=true


# Ispis SQL upita u konzoli (korisno za debagovanje)
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true


# Swagger dokumentacija (interfejs za testiranje endpointa)
# Putanja: http://localhost:8080/swagger-ui.html
springdoc.swagger-ui.path=/swagger-ui.html

config.version=1

management.endpoints.web.exposure.include=health,info,refresh
management.tracing.sampling.probability=1.0
management.zipkin.tracing.endpoint=http://localhost:9411/api/v2/spans
