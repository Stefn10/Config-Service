# Naziv aplikacije i port na kome radi
spring.application.name=finansije-service
server.port=8085
server.error.include-message=always
logging.pattern.level=%5p [${spring.application.name:},%X{traceId:-},%X{spanId:-}]

# MySQL baza
spring.datasource.url=jdbc:mysql://localhost:3306/finansije_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driverClassName=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# SQL init (schema.sql + import.sql)
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql
spring.sql.init.data-locations=classpath:import.sql
spring.sql.init.continue-on-error=false
spring.jpa.defer-datasource-initialization=true

# Feign poziv ka rezervacija servisu (BookingClient u finansije-service)
clients.rezervacija.url=http://localhost:8084

# Swagger dokumentacija
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# Resilience4j circuit breaker (bookingService instanca)
resilience4j.circuitbreaker.instances.bookingService.sliding-window-size=5
resilience4j.circuitbreaker.instances.bookingService.failure-rate-threshold=60
resilience4j.circuitbreaker.instances.bookingService.wait-duration-in-open-state=10s
resilience4j.circuitbreaker.instances.bookingService.permitted-number-of-calls-in-half-open-state=2
resilience4j.circuitbreaker.instances.bookingService.automatic-transition-from-open-to-half-open-enabled=true
resilience4j.circuitbreaker.instances.bookingService.register-health-indicator=true
resilience4j.circuitbreaker.instances.bookingService.record-exceptions=feign.FeignException,feign.RetryableException,java.net.ConnectException,java.net.SocketTimeoutException,java.io.IOException
resilience4j.circuitbreaker.instances.bookingService.ignore-exceptions=jakarta.persistence.EntityNotFoundException,org.baze.exception.RemoteClientException,feign.FeignException$BadRequest,feign.FeignException$NotFound

resilience4j.retry.instances.bookingService.max-attempts=4
resilience4j.retry.instances.bookingService.wait-duration=500ms
resilience4j.retry.instances.bookingService.retry-exceptions=feign.FeignException,feign.RetryableException,java.net.ConnectException,java.net.SocketTimeoutException,java.io.IOException
resilience4j.retry.instances.bookingService.ignore-exceptions=jakarta.persistence.EntityNotFoundException,org.baze.exception.RemoteClientException,feign.FeignException$BadRequest,feign.FeignException$NotFound

# Actuator
management.endpoints.web.exposure.include=health,info,metrics,circuitbreakers,circuitbreakerevents,retries,retryevents,refresh
management.endpoint.health.show-details=always
management.endpoint.health.show-components=always
management.health.circuitbreakers.enabled=true
management.tracing.sampling.probability=1.0
management.zipkin.tracing.endpoint=http://localhost:9411/api/v2/spans

logging.level.io.github.resilience4j=DEBUG
logging.level.org.springframework.cloud.openfeign=WARN

config.version=1
